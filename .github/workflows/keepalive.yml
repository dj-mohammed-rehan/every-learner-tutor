name: keep-alive
# Pings the free Render host so it does not go to sleep before the demo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://every-learner-tutor.onrender.com/api/health
